version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: agentra-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: agentra_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentra_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentra-backend
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/agentra_db
      - JWT_SECRET_KEY=agentra_production_secret_key_change_in_production_min_32_chars!
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - STORAGE_DIRECTORY=storage/documents
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentra-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
